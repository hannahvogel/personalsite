name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - name: Build local audit target
        run: bundle exec jekyll build --destination "${RUNNER_TEMP}/site"
      - name: Serve local audit target
        run: |
          python3 -m http.server 4173 --directory "${RUNNER_TEMP}/site" >"${RUNNER_TEMP}/jekyll-server.log" 2>&1 &
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ >/dev/null
      - name: Run Lighthouse and check shipped baseline
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: http://127.0.0.1:4173/
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-reports
      - name: Require passing Lighthouse assertions
        env:
          LIGHTHOUSE_ASSERTIONS: ${{ steps.lighthouse.outputs.assertionResults }}
        run: |
          jq --exit-status \
            'length == 4 and all(.[]; .passed == true)' \
            <<<"${LIGHTHOUSE_ASSERTIONS}"
